<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nowoczesna aplikacja pogodowa z prognoza godzinowa, 7-dniowa i jakoscia powietrza.">
<meta name="theme-color" content="#0066cc">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<title>Pogoda | Prognoza i AQI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="container">
    <div class="logo">Pogoda</div>
    <nav class="header-controls" aria-label="Sterowanie aplikacja pogodowa">
      <div class="search-wrapper">
        <label for="searchInput" class="visually-hidden">Szukaj miasta</label>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Szukaj miasta..."
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="autocomplete"
          aria-label="Szukaj miasta"
        >
        <div class="autocomplete" id="autocomplete" role="listbox" aria-label="Propozycje miast"></div>
      </div>
      <button class="btn" id="langBtn" type="button" aria-label="Przelacz jezyk">PL</button>
      <button class="btn" id="geoBtn" type="button" aria-label="Uzyj mojej lokalizacji">Lokalizacja</button>
      <button class="btn" id="unitBtn" type="button" aria-label="Przelacz jednostki temperatury" aria-pressed="false">&deg;C</button>
      <button class="btn" id="radarBtn" type="button" aria-label="Przelacz widok mapy opadow" aria-pressed="false" aria-expanded="false">Radar</button>
      <button class="btn btn--filled" id="themeBtn" type="button" aria-label="Przelacz motyw jasny i ciemny" aria-pressed="false">Motyw</button>
    </nav>
  </div>
</header>

<main class="container">
  <div class="main-grid" id="app">
    <div class="loading-text col-12" role="status" aria-live="polite">Ladowanie danych...</div>

    <div class="skeleton-card col-6 skeleton-h-280" aria-hidden="true">
      <div class="skeleton-row">
        <div class="skeleton-line skeleton-line--md"></div>
        <div class="skeleton-line skeleton-line--lg"></div>
        <div class="skeleton-spacer-24"></div>
        <div class="skeleton-line"></div>
      </div>
    </div>

    <div class="skeleton-card col-6 skeleton-h-280" aria-hidden="true">
      <div class="skeleton-row">
        <div class="skeleton-line skeleton-line--md"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>
    </div>

    <div class="skeleton-card col-12 skeleton-h-170" aria-hidden="true">
      <div class="skeleton-row">
        <div class="skeleton-line skeleton-line--md"></div>
        <div class="skeleton-line"></div>
      </div>
    </div>

    <div class="skeleton-card col-12 skeleton-h-210" aria-hidden="true">
      <div class="skeleton-row">
        <div class="skeleton-line skeleton-line--md"></div>
        <div class="skeleton-line"></div>
      </div>
    </div>

    <div class="skeleton-card col-8 skeleton-h-210" aria-hidden="true">
      <div class="skeleton-row">
        <div class="skeleton-line skeleton-line--md"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>
    </div>

    <div class="skeleton-card col-4 skeleton-h-210" aria-hidden="true">
      <div class="skeleton-row">
        <div class="skeleton-line skeleton-line--md"></div>
        <div class="skeleton-line skeleton-line--lg"></div>
      </div>
    </div>
  </div>

  <section class="radar-panel" id="viewMap" hidden>
    <div class="card radar-card">
      <div class="radar-head">
        <div class="label" id="radarTitle">Mapa opadow</div>
        <div class="radar-frame-label" id="radarFrameLabel"></div>
      </div>
      <div id="radarMap" class="radar-map" role="application" aria-label="Mapa opadow">
        <div id="radarStatus" class="radar-status" role="status" aria-live="polite"></div>
      </div>
      <div class="radar-controls">
        <button class="btn" id="radarPrevBtn" type="button" aria-label="Poprzednia klatka radaru">Wstecz</button>
        <button class="btn" id="radarPlayBtn" type="button">Odtwarzaj</button>
        <button class="btn" id="radarNextBtn" type="button" aria-label="Nastepna klatka radaru">Dalej</button>
        <input type="range" id="radarSlider" class="radar-slider" min="0" max="0" value="0" step="1" aria-label="Zmien klatke radaru">
      </div>
      <div class="radar-legend" id="radarLegend" aria-label="Legenda opadow">
        <span class="radar-legend-label" id="radarLegendLight">Lekki deszcz</span>
        <div class="radar-legend-bar" aria-hidden="true"></div>
        <span class="radar-legend-label" id="radarLegendHeavy">Silny deszcz</span>
      </div>
    </div>
  </section>
</main>

<div id="srStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

<footer>
  <div class="container">
    <a href="https://github.com/w3ziqv" target="_blank" rel="noopener noreferrer">GitHub</a>
    <span class="footer-text">Open-Meteo API - Swiss Design</span>
  </div>
</footer>

<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/sw-register.ts"></script>
</body>
</html>
